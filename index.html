<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Respuestas — La Intersección</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf3; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #0d1117; } ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; }
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .badge-pending  { background: #451a03; color: #fb923c; border: 1px solid #9a3412; }
        .badge-correct  { background: #052e16; color: #4ade80; border: 1px solid #166534; }
        .badge-wrong    { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
        .tab-btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; color: #8b949e; }
        .tab-btn.active { background: #1f6feb; color: white; border-color: #388bfd; }
        .tab-btn:not(.active):hover { background: #21262d; color: #e6edf3; }
        input, select, textarea { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 7px 11px; font-size: 13px; outline: none; width: 100%; }
        input:focus, select:focus, textarea:focus { border-color: #58a6ff; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: none; }
        .btn-green  { background: #238636; color: white; } .btn-green:hover  { background: #2ea043; }
        .btn-red    { background: #da3633; color: white; } .btn-red:hover    { background: #f85149; }
        .btn-blue   { background: #1f6feb; color: white; } .btn-blue:hover   { background: #388bfd; }
        .btn-gray   { background: #21262d; color: #e6edf3; border: 1px solid #30363d; } .btn-gray:hover { background: #30363d; }
        .btn-purple { background: #6e40c9; color: white; } .btn-purple:hover { background: #8b5cf6; }
        .row-item { border-bottom: 1px solid #21262d; transition: background 0.1s; }
        .row-item:hover { background: #161b22; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #238636; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 999; transition: opacity 0.3s; }
        .toast.error { background: #da3633; }
        .toast.hidden { opacity: 0; pointer-events: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
        .modal-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
        .notif-tipo-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #30363d; background: #21262d; color: #8b949e; transition: all 0.15s; }
        .notif-tipo-btn.sel { background: #1f6feb; color: white; border-color: #388bfd; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

<!-- Header -->
<header class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
        <h1 class="text-2xl font-black text-white">Panel de Admin</h1>
        <p style="font-size:13px;color:#8b949e;">La Intersección — Respuestas & Notificaciones</p>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-2">
            <span style="font-size:12px;color:#8b949e;">Token admin:</span>
            <input type="password" id="admin-token" placeholder="Tu ID privado completo" style="width:220px;" class="text-xs">
        </div>
        <button class="btn btn-blue" id="load-btn">🔄 Cargar respuestas</button>
    </div>
</header>

<!-- Tabs -->
<div class="flex gap-2 mb-6 flex-wrap">
    <button class="tab-btn active" data-tab="respuestas">📬 Respuestas</button>
    <button class="tab-btn" data-tab="notificaciones">🔔 Enviar notificación</button>
    <button class="tab-btn" data-tab="historial">📋 Historial usuario</button>
    <button class="tab-btn" data-tab="notifs-enviadas">📤 Notifs enviadas</button>
</div>

<!-- ───────────────────────────────────────────────────────── -->
<!-- TAB: RESPUESTAS -->
<!-- ───────────────────────────────────────────────────────── -->
<div id="tab-respuestas">
    <!-- Filtros -->
    <div class="card p-4 mb-4 flex flex-wrap gap-3 items-center">
        <select id="filter-misterio" style="width:180px;">
            <option value="">Todos los misterios</option>
        </select>
        <select id="filter-estado" style="width:150px;">
            <option value="">Todos los estados</option>
            <option value="pending">⏳ Pendientes</option>
            <option value="correct">✅ Correctas</option>
            <option value="wrong">❌ Incorrectas</option>
        </select>
        <input type="text" id="filter-user" placeholder="Filtrar por usuario..." style="width:180px;">
        <span style="font-size:12px;color:#8b949e;" id="results-count"></span>
    </div>

    <!-- Lista -->
    <div class="card overflow-hidden">
        <div id="responses-list">
            <p style="color:#8b949e;font-size:13px;text-align:center;padding:48px 16px;">Introduce el token y pulsa "Cargar respuestas"</p>
        </div>
    </div>
</div>

<!-- ───────────────────────────────────────────────────────── -->
<!-- TAB: NOTIFICACIONES -->
<!-- ───────────────────────────────────────────────────────── -->
<div id="tab-notificaciones" class="hidden">
    <div class="card p-6 max-w-xl">
        <h2 class="text-lg font-bold text-white mb-5">Enviar notificación manual</h2>
        <div class="space-y-4">
            <div>
                <label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Destinatario</label>
                <div class="flex gap-2">
                    <input type="text" id="notif-user" placeholder='ID público (ej: pata#guay) o dejar vacío para "TODOS"'>
                    <button class="btn btn-gray" style="white-space:nowrap;flex-shrink:0;" onclick="document.getElementById('notif-user').value=''">📢 Todos</button>
                </div>
            </div>
            <div>
                <label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Tipo</label>
                <div class="flex gap-2 flex-wrap" id="notif-tipo-btns">
                    <button class="notif-tipo-btn sel" data-tipo="general">🔔 General</button>
                    <button class="notif-tipo-btn" data-tipo="nuevo_misterio">🔍 Nuevo misterio</button>
                    <button class="notif-tipo-btn" data-tipo="anuncio">📢 Anuncio</button>
                    <button class="notif-tipo-btn" data-tipo="respuesta">📬 Respuesta</button>
                </div>
                <input type="hidden" id="notif-tipo" value="general">
            </div>
            <div>
                <label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Título</label>
                <input type="text" id="notif-titulo" placeholder="Título de la notificación">
            </div>
            <div>
                <label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Mensaje</label>
                <textarea id="notif-mensaje" rows="3" placeholder="Cuerpo de la notificación..."></textarea>
            </div>
            <div>
                <label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Enlace (opcional)</label>
                <input type="text" id="notif-link" placeholder="https://...">
            </div>
            <div class="flex justify-end">
                <button class="btn btn-blue" id="send-notif-btn">🚀 Enviar notificación</button>
            </div>
        </div>
    </div>
</div>

<!-- ───────────────────────────────────────────────────────── -->
<!-- TAB: HISTORIAL -->
<!-- ───────────────────────────────────────────────────────── -->
<div id="tab-historial" class="hidden">
    <div class="card p-6 max-w-xl">
        <h2 class="text-lg font-bold text-white mb-4">Historial de un usuario</h2>
        <div class="flex gap-2 mb-4">
            <input type="text" id="hist-user-input" placeholder='ID público (ej: pata#guay)'>
            <button class="btn btn-blue" style="flex-shrink:0;" id="hist-load-btn">Ver historial</button>
        </div>
        <div id="hist-list"><p style="color:#8b949e;font-size:13px;">Introduce el ID público del usuario.</p></div>
    </div>
</div>

<!-- ───────────────────────────────────────────────────────── -->
<!-- TAB: NOTIFICACIONES ENVIADAS -->
<!-- ───────────────────────────────────────────────────────── -->
<div id="tab-notifs-enviadas" class="hidden">
    <div class="card p-4 mb-4 flex flex-wrap gap-3 items-center">
        <select id="notif-sent-filter-tipo" style="width:180px;">
            <option value="">Todos los tipos</option>
            <option value="general">🔔 General</option>
            <option value="respuesta">📬 Respuesta</option>
            <option value="nuevo_misterio">🔍 Nuevo misterio</option>
            <option value="anuncio">📢 Anuncio</option>
        </select>
        <input type="text" id="notif-sent-filter-user" placeholder="Filtrar por usuario (o TODOS)..." style="width:220px;">
        <button class="btn btn-blue" id="load-notifs-sent-btn">🔄 Cargar</button>
        <span style="font-size:12px;color:#8b949e;" id="notifs-sent-count"></span>
    </div>
    <div class="card overflow-hidden">
        <div id="notifs-sent-list">
            <p style="color:#8b949e;font-size:13px;text-align:center;padding:48px 16px;">Pulsa "Cargar" para ver las notificaciones enviadas</p>
        </div>
    </div>
</div>

<!-- Modal de revisión -->
<div id="review-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-white" id="review-title">Revisar respuesta</h3>
            <button onclick="closeReviewModal()" class="text-gray-400 hover:text-white text-xl">×</button>
        </div>
        <div id="review-content" class="space-y-3 mb-5"></div>
        <div>
            <label style="font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Comentario para el usuario (opcional)</label>
            <textarea id="review-comment" rows="3" placeholder="Deja aquí un comentario..."></textarea>
        </div>
        <!-- Botones para respuestas pendientes -->
        <div class="flex gap-3 mt-4 justify-end flex-wrap" id="review-btns-pending">
            <button class="btn btn-gray" onclick="closeReviewModal()">Cancelar</button>
            <button class="btn btn-red" id="review-wrong-btn">❌ Marcar incorrecta</button>
            <button class="btn btn-green" id="review-correct-btn">✅ Marcar correcta</button>
        </div>
        <!-- Botones para respuestas ya marcadas -->
        <div class="flex gap-3 mt-4 justify-end flex-wrap hidden" id="review-btns-marked">
            <button class="btn btn-gray" onclick="closeReviewModal()">Cerrar</button>
            <button class="btn btn-gray" id="review-save-comment-btn">💾 Guardar comentario</button>
            <button class="btn btn-purple" id="review-remark-btn">✏️ Corregir veredicto</button>
        </div>
        <!-- Botones de corrección (ocultos, se muestran al pulsar Corregir) -->
        <div class="flex gap-3 mt-3 justify-end flex-wrap hidden" id="review-btns-remark">
            <span style="font-size:12px;color:#8b949e;align-self:center;">Cambiar a:</span>
            <button class="btn btn-red" id="review-wrong-remark-btn">❌ Incorrecta</button>
            <button class="btn btn-green" id="review-correct-remark-btn">✅ Correcta</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIGURACIÓN — cambia solo esta línea
// ═══════════════════════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWxNV_zyNIUveSDunEUXHCuHIkWmbtLiosFHEHwJYvpprn9_Rsg4OkLZ-pLjXiiO2EbA/exec';

// ═══════════════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════════════
let allResponses = [];
let currentReviewRow = null;

// ═══════════════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════════════
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['respuestas','notificaciones','historial','notifs-enviadas'].forEach(t => {
            document.getElementById('tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab);
        });
    });
});

// ═══════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════
function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (ok ? '' : ' error');
    setTimeout(() => t.classList.add('hidden'), 3000);
}

// ═══════════════════════════════════════════════════════════════════
// CARGAR RESPUESTAS
// ═══════════════════════════════════════════════════════════════════
async function loadResponses() {
    const token = document.getElementById('admin-token').value.trim();
    if (!token) { toast('Introduce el token admin', false); return; }

    document.getElementById('responses-list').innerHTML = '<p style="color:#8b949e;font-size:13px;text-align:center;padding:48px 16px;">⏳ Cargando...</p>';

    try {
        const res  = await fetch(`${APPS_SCRIPT_URL}?action=responses&token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (data.error) { toast('Error: ' + data.error, false); return; }
        allResponses = data;
        populateMisterioFilter();
        renderResponses();
        toast('✅ ' + data.length + ' respuestas cargadas');
    } catch(e) { toast('Error de conexión: ' + e.message, false); }
}

document.getElementById('load-btn').addEventListener('click', loadResponses);

function populateMisterioFilter() {
    const sel = document.getElementById('filter-misterio');
    const ids = [...new Set(allResponses.map(r => r.misterio))].filter(Boolean).sort();
    sel.innerHTML = '<option value="">Todos los misterios</option>' +
        ids.map(id => `<option value="${id}">${id}</option>`).join('');
}

function getFilteredResponses() {
    const mist   = document.getElementById('filter-misterio').value;
    const estado = document.getElementById('filter-estado').value;
    const user   = document.getElementById('filter-user').value.toLowerCase();
    return allResponses.filter(r => {
        if (mist && r.misterio !== mist) return false;
        if (estado === 'pending'  && r.correcto !== false && r.correcto !== true && r.correcto !== null) return false;
        if (estado === 'pending'  && r.comentario)  return false; // si tiene comentario ya fue revisada
        if (estado === 'correct'  && r.correcto !== true) return false;
        if (estado === 'wrong'    && (r.correcto !== false || !r.comentario)) return false;
        if (user && !r.idPublico?.toLowerCase().includes(user) && !r.nombre?.toLowerCase().includes(user)) return false;
        return true;
    });
}

['filter-misterio','filter-estado','filter-user'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderResponses);
    document.getElementById(id).addEventListener('change', renderResponses);
});

function renderResponses() {
    const list = document.getElementById('responses-list');
    const data = getFilteredResponses();
    document.getElementById('results-count').textContent = data.length + ' resultado' + (data.length === 1 ? '' : 's');

    if (!data.length) {
        list.innerHTML = '<p style="color:#8b949e;font-size:13px;text-align:center;padding:48px 16px;">Sin resultados con esos filtros</p>';
        return;
    }

    list.innerHTML = data.map(r => {
        const isPending = !r.correcto && !r.comentario;
        const isCorrect = r.correcto === true;
        const badgeHtml = isPending
            ? '<span class="badge badge-pending">⏳ Pendiente</span>'
            : isCorrect
                ? '<span class="badge badge-correct">✅ Correcta</span>'
                : '<span class="badge badge-wrong">❌ Incorrecta</span>';
        const fecha = (() => { try { return new Date(r.fecha).toLocaleDateString('es', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e) { return r.fecha || ''; } })();

        return `<div class="row-item px-4 py-4 cursor-pointer" data-row="${r.row}" onclick="openReview(${r.row})">
            <div class="flex items-start justify-between gap-4 flex-wrap">
                <div class="flex items-center gap-3 flex-wrap">
                    ${badgeHtml}
                    <span class="text-sm font-bold text-white">${esc(r.nombre || r.idPublico || '?')}</span>
                    <span style="font-size:11px;color:#8b949e;">${esc(r.idPublico || '')}</span>
                    <span style="font-size:11px;background:#21262d;padding:2px 7px;border-radius:10px;color:#79c0ff;">${esc(r.misterio || '')}</span>
                </div>
                <span style="font-size:11px;color:#6b7280;">${fecha}</span>
            </div>
            <p class="text-sm text-gray-300 mt-2 line-clamp-2">${esc(r.solucion || '')}</p>
            ${r.comentario ? `<p style="font-size:11px;color:#8b949e;margin-top:4px;">💬 ${esc(r.comentario)}</p>` : ''}
        </div>`;
    }).join('');
}

// ═══════════════════════════════════════════════════════════════════
// MODAL DE REVISIÓN
// ═══════════════════════════════════════════════════════════════════
function openReview(row) {
    const r = allResponses.find(x => x.row === row);
    if (!r) return;
    currentReviewRow = row;

    const isMarked = r.correcto === true || (r.correcto === false && r.comentario);

    document.getElementById('review-title').textContent = `Revisando: ${r.nombre || r.idPublico} — ${r.misterio}`;
    document.getElementById('review-comment').value = r.comentario || '';

    const fecha = (() => { try { return new Date(r.fecha).toLocaleString('es'); } catch(e) { return r.fecha || ''; } })();

    document.getElementById('review-content').innerHTML = `
        <div class="grid grid-cols-2 gap-3">
            <div style="background:#0d1117;border-radius:8px;padding:12px;">
                <p style="font-size:10px;color:#8b949e;text-transform:uppercase;font-weight:700;margin-bottom:4px;">Usuario</p>
                <p class="text-sm text-white font-bold">${esc(r.nombre || '?')}</p>
                <p style="font-size:11px;color:#8b949e;">${esc(r.idPublico || '')}</p>
            </div>
            <div style="background:#0d1117;border-radius:8px;padding:12px;">
                <p style="font-size:10px;color:#8b949e;text-transform:uppercase;font-weight:700;margin-bottom:4px;">Misterio</p>
                <p class="text-sm text-white font-bold">${esc(r.misterio || '')}</p>
                <p style="font-size:11px;color:#6b7280;">${fecha}</p>
            </div>
        </div>
        ${isMarked ? `<div style="background:${r.correcto ? '#052e16' : '#450a0a'};border-radius:8px;padding:10px;display:flex;align-items:center;gap:8px;">
            <span style="font-size:18px;">${r.correcto ? '✅' : '❌'}</span>
            <span style="font-size:13px;font-weight:700;color:${r.correcto ? '#4ade80' : '#f87171'};">Ya marcada como ${r.correcto ? 'correcta' : 'incorrecta'}</span>
        </div>` : ''}
        <div style="background:#0d1117;border-radius:8px;padding:12px;">
            <p style="font-size:10px;color:#8b949e;text-transform:uppercase;font-weight:700;margin-bottom:6px;">Solución propuesta</p>
            <p class="text-sm text-white">${esc(r.solucion || '—')}</p>
        </div>
        ${r.explicacion ? `<div style="background:#0d1117;border-radius:8px;padding:12px;">
            <p style="font-size:10px;color:#8b949e;text-transform:uppercase;font-weight:700;margin-bottom:6px;">Explicación</p>
            <p class="text-sm text-gray-300">${esc(r.explicacion)}</p>
        </div>` : ''}
        ${r.dificultad ? `<div style="font-size:12px;color:#8b949e;">Dificultad percibida: <span style="color:#e6edf3;">${esc(r.dificultad)}</span></div>` : ''}
        ${r.opinion ? `<div style="background:#0d1117;border-radius:8px;padding:12px;">
            <p style="font-size:10px;color:#8b949e;text-transform:uppercase;font-weight:700;margin-bottom:6px;">Opinión/Sugerencia</p>
            <p class="text-sm text-gray-300">${esc(r.opinion)}</p>
        </div>` : ''}
    `;

    // Mostrar botones según estado
    document.getElementById('review-btns-pending').classList.toggle('hidden', isMarked);
    document.getElementById('review-btns-marked').classList.toggle('hidden', !isMarked);
    document.getElementById('review-btns-remark').classList.add('hidden');

    document.getElementById('review-modal').classList.remove('hidden');
}

function closeReviewModal() {
    document.getElementById('review-modal').classList.add('hidden');
    currentReviewRow = null;
}

async function sendReview(action) {
    if (!currentReviewRow) return;
    const token   = document.getElementById('admin-token').value.trim();
    const comment = encodeURIComponent(document.getElementById('review-comment').value.trim());
    // Identify which button triggered this (could be pending or remark buttons)
    const remarkVisible = !document.getElementById('review-btns-remark').classList.contains('hidden');
    const btn = remarkVisible
        ? document.getElementById(action === 'markCorrect' ? 'review-correct-remark-btn' : 'review-wrong-remark-btn')
        : document.getElementById(action === 'markCorrect' ? 'review-correct-btn' : 'review-wrong-btn');
    btn.disabled = true;
    btn.textContent = '⏳...';

    try {
        const res  = await fetch(`${APPS_SCRIPT_URL}?action=${action}&token=${encodeURIComponent(token)}&row=${currentReviewRow}&comment=${comment}`);
        const data = await res.json();
        if (data.error) { toast('Error: ' + data.error, false); }
        else {
            toast(action === 'markCorrect' ? '✅ Marcada como correcta y puntos asignados' : '❌ Marcada como incorrecta');
            // Actualizar localmente
            const idx = allResponses.findIndex(r => r.row === currentReviewRow);
            if (idx >= 0) {
                allResponses[idx].correcto   = action === 'markCorrect';
                allResponses[idx].comentario = decodeURIComponent(comment);
            }
            closeReviewModal();
            renderResponses();
        }
    } catch(e) { toast('Error de conexión', false); }

    btn.disabled = false;
    btn.textContent = action === 'markCorrect' ? '✅ Correcta' : '❌ Incorrecta';
}

document.getElementById('review-correct-btn').addEventListener('click', () => sendReview('markCorrect'));
document.getElementById('review-wrong-btn').addEventListener('click',   () => sendReview('markIncorrect'));
document.getElementById('review-correct-remark-btn').addEventListener('click', () => sendReview('markCorrect'));
document.getElementById('review-wrong-remark-btn').addEventListener('click',   () => sendReview('markIncorrect'));

// Botón "Guardar comentario" (sin cambiar veredicto)
document.getElementById('review-save-comment-btn').addEventListener('click', async () => {
    if (!currentReviewRow) return;
    const token   = document.getElementById('admin-token').value.trim();
    const comment = document.getElementById('review-comment').value.trim();
    const btn = document.getElementById('review-save-comment-btn');
    btn.disabled = true; btn.textContent = '⏳...';
    try {
        const res  = await fetch(`${APPS_SCRIPT_URL}?action=saveComment&token=${encodeURIComponent(token)}&row=${currentReviewRow}&comment=${encodeURIComponent(comment)}`);
        const data = await res.json();
        if (data.error) { toast('Error: ' + data.error, false); }
        else {
            toast('💾 Comentario guardado');
            const idx = allResponses.findIndex(r => r.row === currentReviewRow);
            if (idx >= 0) allResponses[idx].comentario = comment;
            closeReviewModal();
            renderResponses();
        }
    } catch(e) { toast('Error de conexión', false); }
    btn.disabled = false; btn.textContent = '💾 Guardar comentario';
});

// Botón "Corregir veredicto" → muestra botones de correcto/incorrecto
document.getElementById('review-remark-btn').addEventListener('click', () => {
    document.getElementById('review-btns-remark').classList.remove('hidden');
    document.getElementById('review-remark-btn').classList.add('hidden');
});

// Cerrar modal con Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReviewModal(); });
document.getElementById('review-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeReviewModal(); });

// ═══════════════════════════════════════════════════════════════════
// NOTIFICACIONES MANUALES
// ═══════════════════════════════════════════════════════════════════
document.querySelectorAll('.notif-tipo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.notif-tipo-btn').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
        document.getElementById('notif-tipo').value = btn.dataset.tipo;
    });
});

document.getElementById('send-notif-btn').addEventListener('click', async () => {
    const token   = document.getElementById('admin-token').value.trim();
    const user    = document.getElementById('notif-user').value.trim() || 'TODOS';
    const titulo  = document.getElementById('notif-titulo').value.trim();
    const mensaje = document.getElementById('notif-mensaje').value.trim();
    const tipo    = document.getElementById('notif-tipo').value;
    const link    = document.getElementById('notif-link').value.trim();

    if (!titulo || !mensaje) { toast('Faltan título o mensaje', false); return; }
    if (!token) { toast('Introduce el token admin', false); return; }

    const btn = document.getElementById('send-notif-btn');
    btn.disabled = true; btn.textContent = '⏳ Enviando...';

    try {
        const url = `${APPS_SCRIPT_URL}?action=sendNotif&token=${encodeURIComponent(token)}&user=${encodeURIComponent(user)}&titulo=${encodeURIComponent(titulo)}&msg=${encodeURIComponent(mensaje)}&tipo=${encodeURIComponent(tipo)}&link=${encodeURIComponent(link)}`;
        const res  = await fetch(url);
        const data = await res.json();
        if (data.error) { toast('Error: ' + data.error, false); }
        else {
            toast('🔔 Notificación enviada a ' + (user === 'TODOS' ? 'todos los usuarios' : user));
            document.getElementById('notif-titulo').value  = '';
            document.getElementById('notif-mensaje').value = '';
            document.getElementById('notif-link').value    = '';
        }
    } catch(e) { toast('Error de conexión', false); }

    btn.disabled = false; btn.textContent = '🚀 Enviar notificación';
});

// ═══════════════════════════════════════════════════════════════════
// HISTORIAL DE USUARIO
// ═══════════════════════════════════════════════════════════════════
document.getElementById('hist-load-btn').addEventListener('click', loadHistory);
document.getElementById('hist-user-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadHistory(); });

async function loadHistory() {
    const user  = document.getElementById('hist-user-input').value.trim();
    const token = document.getElementById('admin-token').value.trim();
    if (!user)  { toast('Introduce un ID público', false); return; }
    if (!token) { toast('Introduce el token admin', false); return; }

    const list = document.getElementById('hist-list');
    list.innerHTML = '<p style="color:#8b949e;font-size:13px;">⏳ Cargando...</p>';

    try {
        const res  = await fetch(`${APPS_SCRIPT_URL}?action=history&user=${encodeURIComponent(user)}&token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (data.error) { list.innerHTML = '<p style="color:#f87171;font-size:13px;">Error: ' + esc(data.error) + '</p>'; return; }
        if (!data.length) { list.innerHTML = '<p style="color:#8b949e;font-size:13px;">Sin respuestas registradas.</p>'; return; }

        list.innerHTML = data.map(r => {
            const fecha = (() => { try { return new Date(r.fecha).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return ''; }})();
            const estado = r.correcto ? '✅ Correcta' : (r.comentario ? '❌ Incorrecta' : '⏳ Pendiente');
            const hasReview = allResponses.find(x => x.row === r.row);
            const clickAttr = r.row && hasReview ? `style="cursor:pointer;" onclick="openReview(${r.row})"` : '';
            const hintClick = r.row && hasReview ? `<span style="font-size:10px;color:#388bfd;margin-left:4px;">Ver detalle →</span>` : '';
            return `<div class="row-item" ${clickAttr} style="background:#0d1117;border-radius:8px;padding:12px;margin-bottom:8px;">
                <div class="flex items-center justify-between gap-2 flex-wrap mb-2">
                    <div class="flex items-center gap-2">
                        <span style="font-size:12px;font-weight:700;color:#79c0ff;">${esc(r.misterio || '?')}</span>
                        ${hintClick}
                    </div>
                    <div class="flex items-center gap-2">
                        <span style="font-size:11px;color:#6b7280;">${fecha}</span>
                        <span style="font-size:11px;color:${r.correcto?'#4ade80':r.comentario?'#f87171':'#fb923c'}">${estado}</span>
                    </div>
                </div>
                <p style="font-size:13px;color:#e6edf3;margin-bottom:4px;"><strong>Solución:</strong> ${esc(r.solucion || '—')}</p>
                ${r.explicacion ? `<p style="font-size:12px;color:#8b949e;margin-bottom:4px;">${esc(r.explicacion)}</p>` : ''}
                ${r.comentario ? `<p style="font-size:12px;color:#a78bfa;margin-top:4px;">💬 ${esc(r.comentario)}</p>` : ''}
            </div>`;
        }).join('');
    } catch(e) { list.innerHTML = '<p style="color:#f87171;font-size:13px;">Error de conexión</p>'; }
}

// ═══════════════════════════════════════════════════════════════════
// NOTIFICACIONES ENVIADAS
// ═══════════════════════════════════════════════════════════════════
let allNotifsSent = [];

document.getElementById('load-notifs-sent-btn').addEventListener('click', loadNotifsSent);

async function loadNotifsSent() {
    const token    = document.getElementById('admin-token').value.trim();
    const tipoFil  = document.getElementById('notif-sent-filter-tipo').value;
    const userFil  = document.getElementById('notif-sent-filter-user').value.trim();
    if (!token) { toast('Introduce el token admin', false); return; }

    const list = document.getElementById('notifs-sent-list');
    list.innerHTML = '<p style="color:#8b949e;font-size:13px;text-align:center;padding:48px 16px;">⏳ Cargando...</p>';

    try {
        const params = new URLSearchParams({ action:'getNotifsSent', token });
        if (tipoFil) params.set('tipo', tipoFil);
        if (userFil) params.set('user', userFil);
        const res  = await fetch(`${APPS_SCRIPT_URL}?${params}`);
        const data = await res.json();
        if (data.error) { toast('Error: ' + data.error, false); return; }
        allNotifsSent = data;
        renderNotifsSent();
        toast('📤 ' + data.length + ' notificaciones cargadas');
    } catch(e) { toast('Error de conexión', false); }
}

const NOTIF_ICONS = { respuesta:'📬', anuncio:'📢', nuevo_misterio:'🔍', general:'🔔' };

function renderNotifsSent() {
    const list = document.getElementById('notifs-sent-list');
    document.getElementById('notifs-sent-count').textContent = allNotifsSent.length + ' notificación' + (allNotifsSent.length === 1 ? '' : 'es');

    if (!allNotifsSent.length) {
        list.innerHTML = '<p style="color:#8b949e;font-size:13px;text-align:center;padding:48px 16px;">Sin notificaciones con esos filtros</p>';
        return;
    }

    list.innerHTML = allNotifsSent.map(n => {
        const icon  = NOTIF_ICONS[n.tipo] || '🔔';
        const fecha = (() => { try { return new Date(n.fecha).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; }})();
        const destColor = n.user === 'TODOS' ? '#f59e0b' : '#79c0ff';
        return `<div class="row-item px-4 py-3">
            <div class="flex items-start justify-between gap-3 flex-wrap">
                <div class="flex items-start gap-3 min-w-0">
                    <span style="font-size:18px;flex-shrink:0;">${icon}</span>
                    <div class="min-w-0">
                        <p class="text-sm font-bold text-white">${esc(n.titulo || '')}</p>
                        <p style="font-size:12px;color:#8b949e;margin-top:2px;white-space:pre-line;">${esc(n.mensaje || '')}</p>
                        ${n.link ? `<a href="${esc(n.link)}" target="_blank" style="font-size:11px;color:#388bfd;">🔗 ${esc(n.link)}</a>` : ''}
                    </div>
                </div>
                <div style="text-align:right;flex-shrink:0;">
                    <p style="font-size:11px;color:${destColor};font-weight:700;">${n.user === 'TODOS' ? '📢 Todos' : esc(n.user)}</p>
                    <p style="font-size:11px;color:#6b7280;">${fecha}</p>
                </div>
            </div>
        </div>`;
    }).join('');
}

['notif-sent-filter-tipo'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => {});
});

// ═══════════════════════════════════════════════════════════════════
// UTILIDADES
// ═══════════════════════════════════════════════════════════════════
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
